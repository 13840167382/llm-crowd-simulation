name: Python checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  components:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e 'backend[dev]' -r requirements-analysis.txt
      - name: Backend components (no database or external model)
        env:
          APP_LOG_TO_FILE: 'false'
          APP_REDIS_ENABLED: 'false'
        run: >-
          python -m pytest
          backend/tests/unit/test_decision_engine_components.py
          backend/tests/unit/test_coordinate_precision.py
          backend/tests/unit/test_logger.py -q
      - name: Offline analysis tests
        run: python -m unittest discover -s offline_analysis/tests -v
